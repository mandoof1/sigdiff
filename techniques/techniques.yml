- id: audit-tamper-last
  title: 'runtime audit rule churn: add, delete, clear-all'
  mitre:
  - T1562.001
  command: auditctl -a exit,always -F arch=b64 -S execve -F auid=1000 -k sigdiff-temp; auditctl --delete
    exit,always -F arch=b64 -S execve -F auid=1000 -k sigdiff-temp; auditctl -D; true
  needs_root: true
