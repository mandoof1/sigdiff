- id: persist-sudoersd
  title: sudoers drop-in created then removed
  mitre:
  - T1548.003
  command: 'echo ''Defaults lecture="never" # sigdiff-lab'' > /etc/sudoers.d/sigdiff-lab && rm /etc/sudoers.d/sigdiff-lab'
  needs_root: true
  expect_hits:
  - sudoers-dropin-created
  - sudo-command-executed
  forbid_hits:
