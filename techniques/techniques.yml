- id: ssh-inject-login
  title: forged sshd accepted-login lines (TEST-NET client)
  mitre:
  - T1078.004
  command: 'logger -t sshd ''Accepted password for sigdiff-user from 203.0.113.10 port 40022 ssh2''
    && logger -t sshd ''pam_unix(sshd:session): session opened for user sigdiff-user(uid=1000) by
    (uid=0) (from 203.0.113.10)'''
  needs_root: false
  expect_hits:
  - ssh-accepted-password
  - ssh-accepted-external
  - ssh-session-opened
  - logger-exec-injection
  forbid_hits:
  - ssh-failed-password
  - sudo-auth-failed
  allow_replay: true
- id: ssh-inject-brute
  title: forged sshd failures from one TEST-NET source
  mitre:
  - T1110.001
  command: logger -t sshd 'Failed password for invalid user admin from 203.0.113.11 port 41001 ssh2'
    && logger -t sshd 'Failed password for invalid user admin from 203.0.113.11 port 41002 ssh2' &&
    logger -t sshd 'Failed password for invalid user admin from 203.0.113.11 port 41003 ssh2'
  needs_root: false
  expect_hits:
  - ssh-failed-password
  - logger-exec-injection
  forbid_hits:
  - ssh-accepted-password
  - ssh-accepted-external
  allow_replay: true
- id: sudo-inject-authfail
  title: forged sudo auth-failure line
  mitre:
  - T1110.001
  command: 'logger -t sudo ''sigdiff-lab: 3 incorrect password attempts for meowman on tty pts/0 (uid=1000)'''
  needs_root: false
  expect_hits:
  - sudo-auth-failed
  - logger-exec-injection
  forbid_hits:
  - ssh-failed-password
  - sudo-command-executed
  allow_replay: true
