techniques:
- id: revshell-devtcp
  title: Bash /dev/tcp reverse shell
  mitre:
  - T1059.004
  - T1571
  command: bash -c 'exec 3<>/dev/tcp/127.0.0.1/4444 && echo sigdiff-hand >&3 && exec 3<&- && exec
    3>&-' 2>/dev/null || true
  needs_root: false
  expect_hits:
  - revshell-bash-devtcp
  - suspicious-outbound-4444
  forbid_hits:
  - ld-preload-modified
  - ssh-accepted-external
  - systemd-unit-created
  allow_replay: false
- id: revshell-python
  title: Python socket connect (hand-rolled backconnect)
  mitre:
  - T1090
  - T1571
  command: python3 -c 'import socket;s=socket.socket();s.connect(("127.0.0.1",1337))' 2>/dev/null
    || true
  needs_root: false
  expect_hits:
  - revshell-python-socket
  - suspicious-outbound-1337
  forbid_hits:
  - curl-pipe-shell
  - setuid-bit-granted
  allow_replay: false
- id: curl-pipe-sh
  title: curl fetched script piped to sh
  mitre:
  - T1105
  command: python3 -m http.server 8099 --bind 127.0.0.1 >/dev/null 2>&1 & SRV=$!; sleep 0.5; echo
    'echo sigdiff-executed' > fetchme.sh && curl -s http://127.0.0.1:8099/fetchme.sh | sh; kill $SRV
    2>/dev/null
  needs_root: false
  expect_hits:
  - curl-pipe-shell
  - ingress-tool-transfer
  - lab-http-channel
  - lab-artifact-created
  forbid_hits:
  - setuid-bit-granted
  - ld-preload-modified
  allow_replay: false
- id: base64-stage
  title: base64-decoded payload string
  mitre:
  - T1140
  command: base64 -d <<< 'ZWNobyBzaWdkaWZmLXN0YWdl' > staged.sh && sh staged.sh
  needs_root: false
  expect_hits:
  - base64-decoded-exec
  - lab-artifact-created
  forbid_hits:
  - suspicious-outbound-4444
  - bashrc-modified
  allow_replay: false
- id: history-shred
  title: Bash history file written then removed
  mitre:
  - T1070.003
  command: echo sigdiff-cmd >> /home/meowman/.bash_history && rm -f /home/meowman/.bash_history
  needs_root: false
  expect_hits:
  - rm-shell-history
  - history-file-deleted
  forbid_hits:
  - ld-preload-modified
  - ssh-failed-password
  allow_replay: false
- id: history-env
  title: HISTFILE neutered inside a shell
  mitre:
  - T1070.003
  command: bash -c 'HISTFILE=/dev/null; history -c; unset HISTFILE'
  needs_root: false
  expect_hits:
  - history-env-modified
  forbid_hits:
  - rm-shell-history
  - authorized-keys-modified
  allow_replay: false
- id: discovery-basic
  title: whoami / id / uname / hostname
  mitre:
  - T1033
  - T1087.001
  - T1082
  command: whoami; id; uname -a; hostname
  needs_root: false
  expect_hits:
  - recon-whoami-id
  forbid_hits:
  - revshell-bash-devtcp
  - ssh-session-opened
  allow_replay: false
- id: discovery-netinfo
  title: ip addr + ss enumeration
  mitre:
  - T1016
  - T1049
  command: ip addr; ss -ant
  needs_root: false
  expect_hits:
  - recon-ip-address
  - recon-socket-enumeration
  forbid_hits:
  - suspicious-outbound-4444
  - cron-file-created
  allow_replay: false
- id: discovery-nmap
  title: nmap port probe against loopback
  mitre:
  - T1046
  command: nmap -Pn --max-retries 1 -p 9,19 127.0.0.1 >/dev/null 2>&1 || true
  needs_root: false
  expect_hits:
  - recon-nmap-scan
  forbid_hits:
  - revshell-bash-devtcp
  - setuid-bit-granted
  allow_replay: false
- id: sniff-tcpdump
  title: tcpdump on loopback
  mitre:
  - T1040
  command: tcpdump -c 3 -i lo -nn -w /tmp/sigdiff-lab/work/sigdiff-sniff.pcap 2>/dev/null || true;
    rm -f /tmp/sigdiff-lab/work/sigdiff-sniff.pcap
  needs_root: true
  expect_hits:
  - network-sniffing-tcpdump
  - lab-artifact-created
  - sudo-command-executed
  forbid_hits:
  - suspicious-outbound-1337
  - lab-unit-started
  allow_replay: false
- id: module-load
  title: modprobe/rmmod a harmless module
  mitre:
  - T1547.006
  command: modprobe loop 2>/dev/null || true; rmmod loop 2>/dev/null || true; ls /tmp/sigdiff-lab
    >/dev/null
  needs_root: true
  expect_hits:
  - kernel-module-load
  - kernel-module-unload
  - sudo-command-executed
  forbid_hits:
  - ssh-accepted-password
  - cron-file-created
  allow_replay: false
- id: sysctl-tweak
  title: sysctl -w live kernel parameter change
  mitre:
  - T1547
  command: sysctl -w kernel.shm_rmid_forced=1 >/dev/null; sysctl -w kernel.shm_rmid_forced=0 >/dev/null
  needs_root: true
  expect_hits:
  - sysctl-modification
  - sudo-command-executed
  forbid_hits:
  - kernel-module-load
  - authorized-keys-modified
  allow_replay: false
- id: firewall-insert
  title: iptables rule inserted then removed
  mitre:
