- id: persist-ldpreload
  title: /etc/ld.so.preload planted then removed
  mitre:
  - T1546.006
  command: touch /tmp/sigdiff-lab/work/sigdiff-hook.so && echo /tmp/sigdiff-lab/work/sigdiff-hook.so
