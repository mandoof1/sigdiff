  - cron-file-created
  allow_replay: false
- id: persist-unit
  title: systemd unit planted, started, stopped, removed
  mitre:
  - T1543.002
  command: printf '[Unit]\nDescription=sigdiff lab probe\n[Service]\nExecStart=/bin/sleep 60\n' >
    /etc/systemd/system/sigdiff-lab-probe.service && systemctl daemon-reload && systemctl start sigdiff-lab-probe.service
    && sleep 0.5 && systemctl stop sigdiff-lab-probe.service && rm /etc/systemd/system/sigdiff-lab-probe.service
    && systemctl daemon-reload
  needs_root: true
  expect_hits:
  - systemd-unit-created
  - systemd-unit-removed
  - lab-unit-started
  - lab-unit-stopped
  - sudo-command-executed
  forbid_hits:
  - suspicious-outbound-1337
  - ssh-accepted-password
  allow_replay: false
- id: persist-sshkey
  title: authorized_keys appended then cleaned
  mitre:
  - T1098.004
  command: mkdir -p /home/meowman/.ssh && chmod 700 /home/meowman/.ssh; ssh-keygen -q -t ed25519 -N
    '' -f sigdiff-lab-key >/dev/null 2>&1 && cat sigdiff-lab-key.pub >> /home/meowman/.ssh/authorized_keys;
    rm -f /home/meowman/.ssh/authorized_keys sigdiff-lab-key sigdiff-lab-key.pub
  needs_root: false
  expect_hits:
  - authorized-keys-modified
  - authorized-keys-removed
  - lab-artifact-created
  forbid_hits:
  - suspicious-outbound-4444
  - shadow-file-modified
  allow_replay: false
- id: persist-bashrc
  title: shell rc line appended, then rewritten out
  mitre:
  - T1546.004
  command: echo '# sigdiff-lab-marker' >> /home/meowman/.bashrc && grep -v sigdiff-lab-marker /home/meowman/.bashrc
    > rc.tmp && cat rc.tmp > /home/meowman/.bashrc && rm rc.tmp
  needs_root: false
  expect_hits:
  - bashrc-modified
  forbid_hits:
