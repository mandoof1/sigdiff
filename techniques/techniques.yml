  - bashrc-modified
  allow_replay: false
- id: account-lifecycle
  title: useradd -> usermod -> userdel
  mitre:
  - T1136.001
  - T1098
  - T1531
  command: useradd -M sigdiff-lab-u 2>/dev/null; usermod -aG users sigdiff-lab-u; userdel -r sigdiff-lab-u
    2>/dev/null || true
  needs_root: true
  expect_hits:
  - account-create-useradd
  - account-modify-usermod
  - account-delete-userdel
  - passwd-file-modified
  - shadow-file-modified
  - sudo-command-executed
