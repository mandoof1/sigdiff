- id: persist-cron
  title: cron.d entry planted then removed
  mitre:
  - T1053.003
  command: 'echo ''* * * * * root /bin/true # sigdiff-lab'' > /etc/cron.d/sigdiff-lab && rm /etc/cron.d/sigdiff-lab'
  needs_root: true
  expect_hits:
