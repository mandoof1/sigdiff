name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests tools
      - run: sigdiff compile
      - run: pytest tests/ -q
      # the recorded telemetry windows + the corpus must agree offline, forever
      - run: sigdiff replay
      - run: sigdiff ablate --rules-a rules --rules-b rules-b | grep "gains"
